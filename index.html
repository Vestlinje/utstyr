<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#006451">
<title>Vest Linje AS – Utstyrsdokumentasjon</title>
<link rel="icon" href="vl.png">
<link rel="apple-touch-icon" href="vl.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,600;0,700;1,700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Vest Linje: logo-grøn + logo-grå, fotoband frå mastebiletet, statuskort som overlappar banneret */
:root{--vl-green:#006451;--vl-teal:#017069;--vl-grey:#63656a;--ink:#1c2226;--muted:#5f6670;--line:#dde2e5;--bg:#f2f4f4;--surface:#fff;
--ok:#1e8a4c;--ok-bg:#e5f4ea;--amber:#b35c00;--amber-bg:#fff2de;--red:#c62828;--red-bg:#fdecec;--grey:#6b7380;--grey-bg:#eef0f2;
--display:"Barlow Semi Condensed","Arial Narrow",sans-serif;--body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Roboto Mono",ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.bar{background:#fff}
.bar-in{max-width:760px;margin:0 auto;padding:12px 18px;display:flex;align-items:center}
.bar img{height:38px;width:auto;display:block}
.stripes{display:grid;grid-template-columns:38% 62%;height:5px}
.stripes span:first-child{background:var(--vl-green)}.stripes span:last-child{background:var(--vl-grey)}
.hero{position:relative;height:190px;background:#1d2a2f url(banner.jpg) center 30%/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,24,.15),rgba(10,20,24,.72))}
.hero-in{position:relative;z-index:1;max-width:760px;height:100%;margin:0 auto;padding:0 18px 56px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
.hero h1{font-size:34px;font-style:italic;font-weight:700;line-height:1}
.hero p{margin:4px 0 0;font-size:14px;opacity:.9}
main{max-width:760px;margin:-42px auto 0;padding:0 14px 40px;position:relative;z-index:2;display:grid;gap:16px}
.card{background:var(--surface);border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.10);overflow:hidden}
.verdict{padding:20px 18px;display:flex;gap:16px;align-items:center;background:var(--bg-c);color:var(--c);border-bottom:1px solid var(--line);border-top:6px solid var(--c)}
.verdict .ic{width:54px;height:54px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;font:700 30px var(--display)}
.verdict b{display:block;font:700 32px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.verdict span{font-size:15px;color:var(--ink)}
.verdict span b{display:inline;font:700 26px var(--display);letter-spacing:0;color:var(--ink);text-transform:none}
.s-ok{--c:var(--ok);--bg-c:var(--ok-bg)}.s-snart{--c:var(--amber);--bg-c:var(--amber-bg)}
.s-forfalt,.s-ute{--c:var(--red);--bg-c:var(--red-bg)}.s-ukjend{--c:var(--grey);--bg-c:var(--grey-bg)}
.body{padding:18px;display:grid;gap:20px}
.body h2{font-size:28px;font-weight:700;line-height:1.1}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
h3{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--vl-green);margin-bottom:8px;display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
dl{display:grid;grid-template-columns:140px 1fr;gap:7px 12px;margin:0;font-size:15px}
dt{color:var(--muted)}dd{margin:0;word-break:break-word}
.mono{font-family:var(--mono);font-size:14px}
.ctrl{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:10px 12px}
.ctrl+.ctrl{margin-top:8px}
.ctrl .t{font-weight:500}
.ctrl .m{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.docs a{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;color:var(--vl-green);text-decoration:none;font-weight:500}
.docs a+a{margin-top:6px}.docs a:hover{border-color:var(--vl-green)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--bg-c);color:var(--c);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.notfound{padding:26px 18px}
.notfound h2{font-size:26px}
footer{max-width:760px;margin:0 auto;padding:6px 18px 36px;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px;line-height:1.5}
footer img{width:34px;height:34px}
footer b{color:var(--ink);font-weight:500}
.slogan{font-family:var(--display);font-style:italic;font-weight:700;color:var(--vl-green);font-size:15px}
</style>
</head>
<body>
<div class="bar"><div class="bar-in"><img src="logo.png" alt="Vest Linje AS" width="181" height="38"></div></div>
<div class="stripes" aria-hidden="true"><span></span><span></span></div>
<div class="hero"><div class="hero-in"><h1>Utstyrsdokumentasjon</h1><p>Kontrollstatus for utstyr eigd av Vest Linje AS</p></div></div>
<main id="main"><div class="card"><div class="notfound">Lastar …</div></div></main>
<footer><img src="vl.png" alt=""><div><b>Vest Linje AS</b> · Stord<br><span class="slogan">Viljekraft – frå start til slutt</span></div></footer>
<script>
"use strict";
const VARSEL=30;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const parse=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const fmt=s=>{const d=parse(s);return d?pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear():"–"};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const daysTo=s=>{const d=parse(s);return d?Math.round((d-today())/864e5):null};
function cs(k){const d=daysTo(k.neste);if(d==null)return"ukjend";if(d<0)return"forfalt";if(d<=VARSEL)return"snart";return"ok"}
function status(it){
  if(it.ute)return"ute";
  const s=(it.kontrollar||[]).map(cs);
  if(s.includes("forfalt"))return"forfalt";if(s.includes("snart"))return"snart";if(s.includes("ok"))return"ok";return"ukjend";
}
const LBL={ok:"Godkjent",snart:"Godkjent – kontroll snart",forfalt:"Kontroll forfalt",ute:"Ikkje i bruk",ukjend:"Ingen kontrollfrist"};
const IC={ok:"✓",snart:"!",forfalt:"✕",ute:"✕",ukjend:"–"};
function minNeste(it){return(it.kontrollar||[]).map(k=>k.neste).filter(Boolean).sort()[0]}

function renderItem(it){
  const s=status(it),n=minNeste(it);
  const line=s==="ok"||s==="snart"?`Gyldig til <b>${fmt(n)}</b>`:s==="forfalt"?`Kontrollen gjekk ut ${fmt(n)}. Skal ikkje brukast før ny kontroll.`:s==="ute"?`Utstyret er teke ut av bruk.`:`Utstyret har ingen registrert kontrollfrist.`;
  const kv=[["Type",it.kategori],["Produsent / modell",it.produsent],["Serienummer",it.serienr],["VL-nr.",it.internnr],["Eigar","Vest Linje AS"]].filter(x=>x[1]);
  document.title=it.navn+" – Vest Linje AS";
  $main(`<div class="card">
    <div class="verdict s-${s}"><div class="ic">${IC[s]}</div><div><b>${LBL[s]}</b><span>${line}</span></div></div>
    <div class="body">
      <div><h2>${esc(it.navn)}</h2><div class="sub">${esc([it.internnr,it.kategori,it.serienr&&"S/N "+it.serienr].filter(Boolean).join(" · "))}</div></div>
      <div><h3>Kontroll</h3>${(it.kontrollar||[]).map(k=>{const c=cs(k);return`<div class="ctrl s-${c}"><div class="t">${esc(k.type)} <span class="pill">${c==="ok"?"OK":c==="snart"?"Snart":c==="forfalt"?"Forfalt":"–"}</span></div>
        <div class="m">Sist utført ${fmt(k.sist)}${k.utfortAv?" av "+esc(k.utfortAv):""}${k.ref?" · "+esc(k.ref):""}<br>Neste kontroll <b>${fmt(k.neste)}</b>${k.intervall?" · intervall "+esc(k.intervall)+" mnd":""}</div></div>`}).join("")||`<div class="sub">Ingen kontrollar registrert.</div>`}</div>
      <div><h3>Opplysningar</h3><dl>${kv.map(([a,b])=>`<dt>${a}</dt><dd${a==="Serienummer"?' class="mono"':""}>${esc(b)}</dd>`).join("")}</dl></div>
      ${(it.dokument||[]).length?`<div class="docs"><h3>Dokumentasjon</h3>${it.dokument.filter(d=>/^(https:\/\/|p\/d\/)/.test(d.url||"")).map(d=>`<a href="${esc(d.url)}" target="_blank" rel="noopener">${/youtu/.test(d.url)?'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>':'<svg width="18" height="22" viewBox="0 0 22 26" aria-hidden="true"><path d="M2 1h12l6 6v18H2z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M14 1v6h6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>'}${esc(d.namn)}</a>`).join("")}</div>`:""}
    </div>
  </div>
  <p class="sub" style="text-align:center;margin:0">Status er rekna ut frå registrerte kontrolldatoar per ${fmt(isoToday())}.</p>`);
}
function msg(title,text){document.title="Vest Linje AS – Utstyrsdokumentasjon";$main(`<div class="card"><div class="notfound"><h2>${title}</h2><p class="sub">${text}</p></div></div>`)}
const isoToday=()=>{const d=today();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
function $main(h){document.getElementById("main").innerHTML=h;window.scrollTo(0,0)}
function route(){
  const id=(location.hash||"").slice(1).toLowerCase();
  if(!/^[0-9a-f]{16}$/.test(id)){msg("Skann QR-merket","Skann QR-merket på utstyret for å sjå kontrollstatus og dokumentasjon.");return}
  fetch("p/"+id+".json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(renderItem)
    .catch(()=>msg("Fann ikkje utstyret","Koden er ikkje registrert, eller utstyret er fjerna frå registeret. Kontakt Vest Linje AS."));
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
